<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>Calcos en Realidad Aumentada</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="src/favicon.ico">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>
    <model-viewer id="visor-ar" alt="Efebo de Subiaco" src="assets/efebo.glb" ar
        ar-modes="scene-viewer webxr quick-look" ar-placement="floor" ar-scale="fixed" ar-status="not-presenting"
        interaction-prompt="auto" shadow-intensity="1" camera-controls disable-pan skybox-height="2m" disable-zoom
        min-camera-orbit="auto 90deg auto" max-camera-orbit="auto 90deg auto" touch-action="none" bounds="tight">
        <div class="slider">
            <div class="slides">
                <button class="slide selected" onclick="switchModel(this, 'efebo')"
                    style="background-image: url('assets/thumb-efebo.webp');"></button>
                <button class="slide" onclick="switchModel(this, 'fauno')"
                    style="background-image: url('assets/thumb-fauno.webp');"></button>
                <button class="slide" onclick="switchModel(this, 'luchadores')"
                    style="background-image: url('assets/thumb-luchadores.webp');"></button>
                <button class="slide" onclick="switchModel(this, 'david')"
                    style="background-image: url('assets/thumb-david.webp');"></button>
                <button class="slide" onclick="switchModel(this, 'antinoo')"
                    style="background-image: url('assets/thumb-antinoo.webp');"></button>
                <button class="slide" onclick="switchModel(this, 'ninoEspina')"
                    style="background-image: url('assets/thumb-ninoEspina.webp');"></button>
            </div>
        </div>
        <button slot="ar-button" id="ar-button" class="btn">Ver en Realidad Aumentada</button>
    </model-viewer>

    <div id="info-overlay" class="hidden"></div>

    <div id="info-panel" class="hidden">
        <img src="src/cerrar.png" alt="Cerrar" id="close-panel">
        <div class="panel-header">
            <h2 id="panel-titulo"></h2>
        </div>
        <hr>
        <h4 id="panel-meta"></h4>
        <div id="panel-contenido"></div>
    </div>

    <a href="https://www2.fba.unlp.edu.ar/areamuseo/" target="_blank" id="logo-link">
        <img src="src/logo.png" alt="Logo">
    </a>

    <div id="info-button">
        <img src="src/informacion.png" alt="Info">
    </div>

    <script src="main.js"></script>
</body>

</html>
